[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "devpilot"
version = "0.1.0"
description = "DevPilot — autonomous multi-agent engineering guild (PS-001)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "networkx>=3.3",
  "tree-sitter>=0.22",
  "tree-sitter-language-pack>=0.2",
  "coverage>=7.5",
  "pytest>=8.2",
  "hypothesis>=6.100",
  "radon>=6.0",
  "aiosqlite>=0.20",
  "tomli-w>=1.0",
  "jsonpatch>=1.33",
  "jsonschema>=4.22",
  "psutil>=5.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
security = ["bandit>=1.7", "semgrep>=1.70"]
memory = ["fastembed>=0.3"]
docker = ["docker>=7.1"]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]

[project.scripts]
devpilot = "devpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["devpilot"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["fixtures", "runs", "web", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
per-file-ignores = { "devpilot/engine/modes.py" = ["RUF005"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["fixtures/", "runs/", "web/"]
