name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          python -m ruff check .

      - name: Type check with mypy (core only)
        run: |
          python -m mypy devpilot/core devpilot/config.py

      - name: Run tests with pytest
        run: |
          python -m pytest -q

  web:
    name: Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check if web workspace exists
        id: check_web
        shell: bash
        run: |
          if [ -f "web/package.json" ]; then
            echo "web_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_exists=false" >> "$GITHUB_OUTPUT"
            echo "web/package.json not yet present; skipping web checks."
          fi

      - name: Install web dependencies
        if: steps.check_web.outputs.web_exists == 'true'
        working-directory: web
        run: npm ci

      - name: Run web typecheck
        if: steps.check_web.outputs.web_exists == 'true'
        working-directory: web
        run: npm run typecheck

      - name: Run web tests
        if: steps.check_web.outputs.web_exists == 'true'
        working-directory: web
        run: npm test
