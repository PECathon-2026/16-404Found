services:
  backend:
    build: ./backend
    image: devpilot-backend
    ports: ["8000:8000"]
    env_file:
      - path: ./backend/.env      # optional: model keys, GITHUB_TOKEN
        required: false
    environment:
      DEVPILOT_CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
    volumes:
      - devpilot-data:/data
      - ./eval:/eval:ro           # demo scenarios
    restart: unless-stopped
volumes:
  devpilot-data:
